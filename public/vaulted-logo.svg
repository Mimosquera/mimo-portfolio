<svg viewBox="0 0 64 64" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vaultGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="1"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="1"/>
    </linearGradient>
    <filter id="vaultGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer vault frame -->
  <rect x="6" y="8" width="52" height="48" rx="4" fill="none" stroke="url(#vaultGradient)" stroke-width="1.5"/>

  <!-- Door bolts -->
  <circle cx="14" cy="14" r="2" fill="url(#vaultGradient)"/>
  <circle cx="50" cy="14" r="2" fill="url(#vaultGradient)"/>
  <circle cx="14" cy="50" r="2" fill="url(#vaultGradient)"/>
  <circle cx="50" cy="50" r="2" fill="url(#vaultGradient)"/>

  <!-- Central dial background -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="url(#vaultGradient)" stroke-width="1" opacity="0.5"/>

  <!-- Dial ring -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="url(#vaultGradient)" stroke-width="1.5" filter="url(#vaultGlow)"/>

  <!-- Center lock mechanism -->
  <circle cx="32" cy="32" r="8" fill="none" stroke="url(#vaultGradient)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="5" fill="url(#vaultGradient)" opacity="0.3"/>

  <!-- Dial markers -->
  <line x1="45" y1="32" x2="47" y2="32" stroke="url(#vaultGradient)" stroke-width="1.2" opacity="0.7"/>
  <line x1="41.19" y1="41.19" x2="42.61" y2="42.61" stroke="url(#vaultGradient)" stroke-width="1.2" opacity="0.7"/>
  <line x1="32" y1="45" x2="32" y2="47" stroke="url(#vaultGradient)" stroke-width="1.2" opacity="0.7"/>
  <line x1="22.81" y1="41.19" x2="21.39" y2="42.61" stroke="url(#vaultGradient)" stroke-width="1.2" opacity="0.7"/>
  <line x1="19" y1="32" x2="17" y2="32" stroke="url(#vaultGradient)" stroke-width="1.2" opacity="0.7"/>
  <line x1="22.81" y1="22.81" x2="21.39" y2="21.39" stroke="url(#vaultGradient)" stroke-width="1.2" opacity="0.7"/>
  <line x1="32" y1="19" x2="32" y2="17" stroke="url(#vaultGradient)" stroke-width="1.2" opacity="0.7"/>
  <line x1="41.19" y1="22.81" x2="42.61" y2="21.39" stroke="url(#vaultGradient)" stroke-width="1.2" opacity="0.7"/>

  <!-- Handle -->
  <path d="M 32 18 Q 45 18 45 32 Q 45 46 32 46" fill="none" stroke="url(#vaultGradient)" stroke-width="2" stroke-linecap="round"/>

  <!-- Inner security stripes -->
  <line x1="12" y1="24" x2="52" y2="24" stroke="url(#vaultGradient)" stroke-width="0.5" opacity="0.3"/>
  <line x1="12" y1="40" x2="52" y2="40" stroke="url(#vaultGradient)" stroke-width="0.5" opacity="0.3"/>
</svg>
